<!DOCTYPE html>
<html id="storiesPg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>MCR Trans Flag Project</title>
        </head>

<body>

    <!-- header links -->
    <div class="headerContainer">
        <p class="headerIcon"><a href="index.html">[logo]</a></p>
        <img style="width: 11%;" class="headerLink" onclick="location.href = 'about.html';" src="assets/flag-icon.png">
        <img style="width: 10%;" class="headerLink" onclick="location.href = 'stories.html';" src="assets/stories-icon.png">
        <img style="width: 10%;" class="headerLink" onclick="location.href = 'doc.html';" src="assets/doc-icon.png">
        <img style="width: 10%;" class="headerLink" onclick="location.href = 'participate.html';" src="assets/participate-icon.png">
        <img style="width: 7%;" class="headerLink" onclick="location.href = 'blog.html';" src="assets/blog-icon.png">
    </div>

    <!-- page title -->
    <div id="titleContainer">
        <p class="typewriterTitle">fan stories index</p>  
        <img style="width:42vw;" src="assets/lines1.png">  
    </div>
   
    <!-- page subtitle -->
    <div id="storiesSubtitle">
        <p style="margin-left:5%;">Each of our flags carries the names, stories, and histories of hundreds of trans and gender non-conforming MCR fans.</p>
        <p style="margin-left:5%;margin-bottom:8vh;">Click on the flags below to explore each one.</p>
    </div>

    <!-- horizontal container to arrange the flag images -->
    <div class="horizontalContainer">
        <img class="flagLink" id="flag1" onclick="location.href = 'flag1.html';" src="assets/flag01_front.png">
        <img class="flagLink" id="flag2" onclick="location.href = 'flag2.html';" src="assets/flag02_front.png">
        <img class="flagLink" id="flag3" onclick="location.href = 'flag3.html';" src="assets/flag03_front.png">
    </div>


    <!-- script to control the hover effect on the images -->
    <script>
        const flag1 = document.getElementById('flag1');
        flag1.addEventListener('mouseover', function() {
            flag1.src = 'assets/flag01_back.png';   
        })
        flag1.addEventListener('mouseout', function() {
            flag1.src = 'assets/flag01_front.png';
        })
        
        const flag2 = document.getElementById('flag2');
        flag2.addEventListener('mouseover', function() {
            flag2.src = 'assets/flag02_back.png';   
        })
        flag2.addEventListener('mouseout', function() {
            flag2.src = 'assets/flag02_front.png';
        })

        const flag3 = document.getElementById('flag3');
        flag3.addEventListener('mouseover', function() {
            flag3.src = 'assets/flag03_back.png';   
        })
        flag3.addEventListener('mouseout', function() {
            flag3.src = 'assets/flag03_front.png';
        })
    </script>

</body>
</html>
